<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font: 13px system-ui, sans-serif;
      width: 240px;
      margin: 0;
      padding: 12px;
      color: #222;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    button {
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 6px;
      background: #aad500;
      color: #1a1a1a;
      font-weight: 600;
      cursor: pointer;
    }
    button.on { background: #e5e5e5; }
    button:disabled { opacity: .5; cursor: default; }
    label { display: flex; gap: 6px; align-items: center; margin-top: 12px; }
    #status { margin: 0 0 10px; color: #555; }
  </style>
</head>
<body>
  <h1>Solo Falabella</h1>
  <p id="status">…</p>
  <button id="toggle" disabled>Mostrar solo Falabella</button>
  <label>
    <input type="checkbox" id="auto">
    Aplicar automáticamente
  </label>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
